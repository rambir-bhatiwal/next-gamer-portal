<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040108"/>
      <stop offset="50%" stop-color="#14020a"/>
      <stop offset="100%" stop-color="#020008"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Incoming Warhead Streaks -->
  <g stroke="#ff1744" stroke-width="2" stroke-dasharray="8,4">
    <line x1="80" y1="40" x2="220" y2="340"/>
    <line x1="280" y1="40" x2="310" y2="280"/>
    <line x1="520" y1="40" x2="380" y2="340"/>
  </g>
  <!-- Flak Interception Clouds -->
  <g filter="url(#neonGlow)">
    <!-- Flak Cloud 1 -->
    <circle cx="310" cy="240" r="38" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="310" cy="240" r="16" fill="#ffffff"/>

    <!-- Flak Cloud 2 -->
    <circle cx="170" cy="180" r="32" fill="rgba(255, 0, 127, 0.4)" stroke="#ff007f" stroke-width="2"/>

    <!-- Flak Cloud 3 -->
    <circle cx="430" cy="210" r="34" fill="rgba(255, 215, 0, 0.4)" stroke="#ffd700" stroke-width="2"/>

    <!-- Metropolitan Domes on Ground -->
    <path d="M120 360 A 30 30 0 0 1 180 360 Z" fill="#00f0ff" opacity="0.8"/>
    <path d="M220 360 A 25 25 0 0 1 270 360 Z" fill="#00f0ff" opacity="0.8"/>
    <path d="M330 360 A 25 25 0 0 1 380 360 Z" fill="#00f0ff" opacity="0.8"/>
    <path d="M420 360 A 30 30 0 0 1 480 360 Z" fill="#00f0ff" opacity="0.8"/>

    <!-- Defense Turret Batteries -->
    <polygon points="50,360 80,330 110,360" fill="#7928ca"/>
    <line x1="80" y1="330" x2="170" y2="180" stroke="#ff007f" stroke-width="2"/>

    <polygon points="285,360 300,325 315,360" fill="#00f0ff"/>
    <line x1="300" y1="325" x2="310" y2="240" stroke="#00f0ff" stroke-width="2"/>

    <polygon points="490,360 520,330 550,360" fill="#7928ca"/>
    <line x1="520" y1="330" x2="430" y2="210" stroke="#ffd700" stroke-width="2"/>
  </g>
  <!-- Ground Baseline -->
  <rect x="0" y="360" width="600" height="40" fill="#0a0518" stroke="#ff007f" stroke-width="2"/>
  <!-- Title Badge -->
  <rect x="110" y="24" width="380" height="34" rx="6" fill="rgba(6, 2, 18, 0.85)" stroke="#ff1744" stroke-width="1.5"/>
  <text x="300" y="47" font-family="'Rajdhani', monospace, sans-serif" font-size="16" font-weight="900" fill="#ff1744" letter-spacing="3" text-anchor="middle" filter="url(#neonGlow)">VORTEX MISSILE COMMAND</text>
</svg>
