<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1328"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="480" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- Graphic Icon Elements -->
  <g>
    <path d="M 80 240 L 220 240 L 220 140 L 360 140 L 360 340 L 420 340" fill="none" stroke="#1c2850" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
               <path d="M 80 240 L 220 240 L 220 140 L 360 140 L 360 340 L 420 340" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="10 10"/>
               <!-- Pulse Tower -->
               <polygon points="170,180 190,140 210,180" fill="#00f0ff" filter="url(#glow)"/>
               <circle cx="190" cy="140" r="8" fill="#ffffff"/>
               <!-- Railgun Tower -->
               <rect x="290" y="200" width="30" height="40" rx="4" fill="#ff007f" filter="url(#glow)"/>
               <line x1="305" y1="200" x2="305" y2="170" stroke="#ffd600" stroke-width="5"/>
               <!-- Malware Enemy -->
               <circle cx="220" cy="190" r="10" fill="#ff1744" filter="url(#glow)"/>
  </g>

  <!-- Typography & Badge -->
  <rect x="40" y="390" width="400" height="60" rx="8" fill="#080c1cd0" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="240" y="420" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2" filter="url(#glow)">TOWER DEFENSE</text>
  <text x="240" y="440" fill="#ff007f" font-family="'Rajdhani', sans-serif, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">SUBNET GUARDIAN</text>

  <!-- Corner Brackets -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <path d="M 450 10 L 470 10 L 470 30" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <path d="M 470 450 L 470 470 L 450 470" fill="none" stroke="#ff007f" stroke-width="3"/>
  <path d="M 30 470 L 10 470 L 10 450" fill="none" stroke="#ff007f" stroke-width="3"/>
</svg>