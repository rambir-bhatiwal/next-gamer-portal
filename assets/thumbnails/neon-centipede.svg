<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d06"/>
      <stop offset="50%" stop-color="#05140d"/>
      <stop offset="100%" stop-color="#020512"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Fungal Mushroom Obstacles -->
  <g filter="url(#neonGlow)">
    <path d="M140 140 A 18 18 0 0 1 176 140 Z" fill="#ff007f"/>
    <rect x="154" y="140" width="8" height="14" fill="#ffffff"/>

    <path d="M260 180 A 18 18 0 0 1 296 180 Z" fill="#ffaa00"/>
    <rect x="274" y="180" width="8" height="14" fill="#ffffff"/>

    <path d="M420 120 A 18 18 0 0 1 456 120 Z" fill="#00ff88"/>
    <rect x="434" y="120" width="8" height="14" fill="#ffffff"/>

    <path d="M360 250 A 18 18 0 0 1 396 250 Z" fill="#7928ca"/>
    <rect x="374" y="250" width="8" height="14" fill="#ffffff"/>
  </g>
  <!-- Segmented Neon Centipede -->
  <g filter="url(#neonGlow)">
    <!-- Head -->
    <circle cx="210" cy="110" r="16" fill="#ff0055" stroke="#ffffff" stroke-width="2"/>
    <circle cx="204" cy="106" r="3" fill="#ffffff"/>
    <circle cx="204" cy="114" r="3" fill="#ffffff"/>
    <!-- Antennas -->
    <line x1="198" y1="104" x2="186" y2="96" stroke="#ff0055" stroke-width="2"/>
    <line x1="198" y1="116" x2="186" y2="124" stroke="#ff0055" stroke-width="2"/>

    <!-- Segments -->
    <circle cx="240" cy="110" r="14" fill="#00ff88"/>
    <circle cx="270" cy="110" r="14" fill="#00ff88"/>
    <circle cx="300" cy="110" r="14" fill="#00f0ff"/>
    <circle cx="330" cy="110" r="14" fill="#00f0ff"/>
    <circle cx="360" cy="110" r="14" fill="#ffd700"/>
    <circle cx="390" cy="110" r="14" fill="#ffd700"/>
  </g>
  <!-- Laser Buggy Cannon & Vertical Blast -->
  <g filter="url(#neonGlow)">
    <polygon points="300,340 285,365 315,365" fill="#00f0ff"/>
    <rect x="297" y="330" width="6" height="12" fill="#ffffff"/>
    <line x1="300" y1="330" x2="300" y2="130" stroke="#00f0ff" stroke-width="3"/>
  </g>
  <!-- Title Badge -->
  <rect x="135" y="24" width="330" height="34" rx="6" fill="rgba(4, 16, 8, 0.85)" stroke="#00ff88" stroke-width="1.5"/>
  <text x="300" y="47" font-family="'Rajdhani', monospace, sans-serif" font-size="16" font-weight="900" fill="#00ff88" letter-spacing="3" text-anchor="middle" filter="url(#neonGlow)">NEON CENTIPEDE</text>
</svg>
