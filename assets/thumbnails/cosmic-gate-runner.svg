<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Cosmic Gate Runner Game Banner">
  <defs>
    <linearGradient id="cgrBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0a031a" />
      <stop offset="60%" stop-color="#180738" />
      <stop offset="100%" stop-color="#2d0a54" />
    </linearGradient>
    <linearGradient id="cgrGate" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="cgrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#cgrBg)" />
  <!-- Distant Stars & Cosmic Dust -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.5" /><circle cx="200" cy="80" r="1" /><circle cx="340" cy="40" r="2" />
    <circle cx="480" cy="90" r="1.2" /><circle cx="530" cy="45" r="1.8" filter="url(#cgrGlow)" />
  </g>
  <!-- Pseudo-3D Perspective Road -->
  <polygon points="260,170 340,170 540,340 60,340" fill="#0b0e24" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="300" y1="170" x2="300" y2="340" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 12" />
  <!-- Gate Barrier 1 (Distant) -->
  <polygon points="280,185 320,185 320,175 280,175" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#cgrGlow)" />
  <!-- Gate Barrier 2 (Mid-range) -->
  <polygon points="240,230 360,230 360,210 240,210" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#cgrGlow)" />
  <text x="300" y="225" font-family="'Orbitron', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="900">QUIZ GATE 01</text>
  <!-- Gate Barrier 3 (Foreground Arch) -->
  <path d="M 120,340 L 120,250 Q 300,210 480,250 L 480,340" fill="none" stroke="url(#cgrGate)" stroke-width="5" filter="url(#cgrGlow)" />
  <!-- Cockpit HUD Elements -->
  <path d="M 180,340 L 220,310 L 380,310 L 420,340 Z" fill="rgba(6, 12, 28, 0.9)" stroke="#00f0ff" stroke-width="1.5" />
  <text x="300" y="330" font-family="monospace" font-size="11" fill="#00f0ff" text-anchor="middle">VELOCITY: 840 KM/H | 45 LEVELS</text>
  <!-- Banner Title Overlay -->
  <rect x="25" y="25" width="280" height="34" rx="6" fill="rgba(8, 3, 22, 0.85)" stroke="#00f0ff" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    COSMIC <tspan fill="#00f0ff">GATE RUNNER</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#00f0ff" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#070913" letter-spacing="1">RACING</text>
</svg>
