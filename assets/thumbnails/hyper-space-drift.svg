<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="HyperSpace Drift Zero-G Game Banner">
  <!-- HyperSpace Drift Zero-G Thumbnail Graphic -->
  <defs>
    <radialGradient id="hsdBg" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0e1730" />
      <stop offset="40%" stop-color="#080d1c" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="shipHull" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a6c8ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="thrusterFire" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="hsdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="600" height="340" fill="url(#hsdBg)" />

  <!-- Twinkling Starfield -->
  <g fill="#ffffff">
    <circle cx="45" cy="40" r="1.5" opacity="0.8" />
    <circle cx="120" cy="85" r="1" opacity="0.6" />
    <circle cx="210" cy="30" r="2" opacity="0.9" filter="url(#hsdGlow)" />
    <circle cx="340" cy="50" r="1.2" opacity="0.7" />
    <circle cx="450" cy="70" r="1" opacity="0.5" />
    <circle cx="560" cy="45" r="2" opacity="0.9" filter="url(#hsdGlow)" />
    <circle cx="80" cy="180" r="1" opacity="0.4" />
    <circle cx="150" cy="270" r="1.5" opacity="0.7" />
    <circle cx="310" cy="310" r="1.2" opacity="0.6" />
    <circle cx="430" cy="240" r="1" opacity="0.5" />
    <circle cx="520" cy="280" r="2" opacity="0.8" filter="url(#hsdGlow)" />
    <circle cx="580" cy="190" r="1" opacity="0.6" />
  </g>

  <!-- Distant Cosmic Nebula Glow -->
  <circle cx="420" cy="160" r="120" fill="#7000ff" opacity="0.18" filter="url(#hsdGlow)" />
  <circle cx="460" cy="190" r="90" fill="#ff007f" opacity="0.14" filter="url(#hsdGlow)" />

  <!-- Fractured Asteroids in Orbit -->
  <!-- Asteroid 1: Large -->
  <g transform="translate(380, 80) rotate(25)">
    <polygon points="0,20 25,-10 60,-5 85,25 70,65 30,75 -5,50" fill="#141c30" stroke="#00f0ff" stroke-width="1.8" filter="url(#hsdGlow)" />
    <line x1="25" y1="-10" x2="40" y2="35" stroke="rgba(0,240,255,0.4)" stroke-width="1" />
    <line x1="40" y1="35" x2="70" y2="65" stroke="rgba(0,240,255,0.4)" stroke-width="1" />
    <circle cx="40" cy="35" r="4" fill="#00f0ff" opacity="0.5" />
  </g>

  <!-- Asteroid 2: Medium Fragment -->
  <g transform="translate(100, 190) rotate(-15)">
    <polygon points="10,0 45,5 60,35 35,55 0,35" fill="#141c30" stroke="#ff007f" stroke-width="1.5" filter="url(#hsdGlow)" />
    <line x1="10" y1="0" x2="30" y2="30" stroke="rgba(255,0,127,0.4)" stroke-width="1" />
  </g>

  <!-- Asteroid 3: Shattered Debris Pieces -->
  <polygon points="460,250 475,245 480,260 468,268" fill="#141c30" stroke="#00f0ff" stroke-width="1" />
  <polygon points="495,240 510,245 505,255" fill="#141c30" stroke="#00f0ff" stroke-width="1" />
  <polygon points="470,285 485,280 488,295 472,300" fill="#141c30" stroke="#00f0ff" stroke-width="1" />

  <!-- Twin Plasma Blaster Bolts -->
  <line x1="260" y1="150" x2="360" y2="120" stroke="#00f0ff" stroke-width="3.5" filter="url(#hsdGlow)" />
  <line x1="255" y1="168" x2="355" y2="138" stroke="#00f0ff" stroke-width="3.5" filter="url(#hsdGlow)" />

  <!-- Vector Interceptor Spacecraft Drifting at an Angle -->
  <g transform="translate(200, 170) rotate(-22)">
    <!-- Plasma Thruster Plume -->
    <polygon points="-75,0 -15,-10 -5,0 -15,10" fill="url(#thrusterFire)" filter="url(#hsdGlow)" />
    <polygon points="-40,0 -10,-4 0,0 -10,4" fill="#ffffff" filter="url(#hsdGlow)" />

    <!-- Ship Main Hull -->
    <polygon points="45,0 -15,-22 -5,-8 -15,0 -5,8 -15,22" fill="#0d182e" stroke="url(#shipHull)" stroke-width="2.5" filter="url(#hsdGlow)" />
    
    <!-- Cockpit Canopy -->
    <polygon points="18,0 -2,-6 5,0 -2,6" fill="#00f0ff" opacity="0.9" filter="url(#hsdGlow)" />
    <!-- Wing Cannon Hardpoints -->
    <circle cx="-5" cy="-18" r="3" fill="#ff007f" filter="url(#hsdGlow)" />
    <circle cx="-5" cy="18" r="3" fill="#ff007f" filter="url(#hsdGlow)" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="250" height="34" rx="6" fill="rgba(2, 4, 10, 0.85)" stroke="#00f0ff" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    HYPERSPACE <tspan fill="#00f0ff">DRIFT</tspan>
  </text>
  
  <rect x="500" y="25" width="75" height="26" rx="4" fill="#7000ff" />
  <text x="515" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">
    SPACE
  </text>
</svg>
