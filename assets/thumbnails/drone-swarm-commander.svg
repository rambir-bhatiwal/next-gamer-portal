<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1328"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="480" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- Graphic Icon Elements -->
  <g>
    <circle cx="240" cy="240" r="110" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3"/>
               <circle cx="240" cy="240" r="70" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
               <!-- Radar Sweep Line -->
               <line x1="240" y1="240" x2="330" y2="170" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
               <!-- Drone Boids Flock -->
               <polygon points="260,190 268,205 252,205" fill="#00e5ff"/>
               <polygon points="280,180 288,195 272,195" fill="#00e5ff"/>
               <polygon points="290,210 298,225 282,225" fill="#00e5ff"/>
               <polygon points="310,195 318,210 302,210" fill="#00e5ff"/>
               <!-- Hostile Target -->
               <circle cx="180" cy="280" r="8" fill="#ff1744" filter="url(#glow)"/>
  </g>

  <!-- Typography & Badge -->
  <rect x="40" y="390" width="400" height="60" rx="8" fill="#080c1cd0" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="240" y="420" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2" filter="url(#glow)">DRONE SWARM</text>
  <text x="240" y="440" fill="#e040fb" font-family="'Rajdhani', sans-serif, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">TACTICAL PATROL</text>

  <!-- Corner Brackets -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M 450 10 L 470 10 L 470 30" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M 470 450 L 470 470 L 450 470" fill="none" stroke="#e040fb" stroke-width="3"/>
  <path d="M 30 470 L 10 470 L 10 450" fill="none" stroke="#e040fb" stroke-width="3"/>
</svg>