<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1328"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="480" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <g opacity="0.15" stroke="#ff3d00" stroke-width="1">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- Graphic Icon Elements -->
  <g>
    <rect x="140" y="160" width="200" height="160" rx="8" fill="#0e1322" stroke="#ff3d00" stroke-width="2"/>
               <!-- Grid Cells -->
               <line x1="190" y1="160" x2="190" y2="320" stroke="#253255" stroke-width="2"/>
               <line x1="240" y1="160" x2="240" y2="320" stroke="#253255" stroke-width="2"/>
               <line x1="290" y1="160" x2="290" y2="320" stroke="#253255" stroke-width="2"/>
               <!-- Heavy Combat Mech Silhouette -->
               <rect x="200" y="220" width="30" height="36" rx="4" fill="#ff3d00" filter="url(#glow)"/>
               <rect x="195" y="226" width="6" height="24" fill="#ffd600"/>
               <rect x="229" y="226" width="6" height="24" fill="#ffd600"/>
               <!-- Targeting Reticle -->
               <circle cx="290" cy="240" r="16" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2"/>
               <circle cx="290" cy="240" r="3" fill="#ff1744"/>
  </g>

  <!-- Typography & Badge -->
  <rect x="40" y="390" width="400" height="60" rx="8" fill="#080c1cd0" stroke="#ff3d00" stroke-width="1.5"/>
  <text x="240" y="420" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2" filter="url(#glow)">MECH TACTICS</text>
  <text x="240" y="440" fill="#ffd600" font-family="'Rajdhani', sans-serif, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">GRID SKIRMISH</text>

  <!-- Corner Brackets -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#ff3d00" stroke-width="3"/>
  <path d="M 450 10 L 470 10 L 470 30" fill="none" stroke="#ff3d00" stroke-width="3"/>
  <path d="M 470 450 L 470 470 L 450 470" fill="none" stroke="#ffd600" stroke-width="3"/>
  <path d="M 30 470 L 10 470 L 10 450" fill="none" stroke="#ffd600" stroke-width="3"/>
</svg>