<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Isometric Precision Racer Game Banner">
  <defs>
    <radialGradient id="iprBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1630" />
      <stop offset="100%" stop-color="#030610" />
    </radialGradient>
    <filter id="iprGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#iprBg)" />
  <!-- Isometric Grid Track -->
  <g transform="translate(300, 160) scale(1, 0.58) rotate(45)">
    <!-- Track Ring -->
    <rect x="-140" y="-140" width="280" height="280" rx="40" fill="none" stroke="#00f0ff" stroke-width="18" filter="url(#iprGlow)" />
    <rect x="-140" y="-140" width="280" height="280" rx="40" fill="none" stroke="#081024" stroke-width="12" />
    <rect x="-140" y="-140" width="280" height="280" rx="40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 8" />
    <!-- Apex Kerbs -->
    <rect x="-165" y="-165" width="40" height="40" fill="#ff007f" filter="url(#iprGlow)" />
    <rect x="125" y="125" width="40" height="40" fill="#ffaa00" />
    <!-- Player Car Silhouette Drifting -->
    <g transform="translate(140, 20) rotate(15)">
      <!-- Tire Skid Trail -->
      <path d="M-30,-10 L-8,-5" stroke="#00f0ff" stroke-width="3" opacity="0.6" />
      <path d="M-30,10 L-8,5" stroke="#00f0ff" stroke-width="3" opacity="0.6" />
      <rect x="-16" y="-10" width="32" height="20" rx="4" fill="#00f0ff" filter="url(#iprGlow)" />
      <rect x="-6" y="-7" width="14" height="14" rx="2" fill="#030610" />
    </g>
    <!-- Translucent Ghost Car -->
    <g transform="translate(140, -40) rotate(0)" opacity="0.45">
      <rect x="-16" y="-10" width="32" height="20" rx="4" fill="none" stroke="#00ff88" stroke-width="2" />
    </g>
  </g>
  <!-- HUD Details -->
  <rect x="25" y="25" width="320" height="34" rx="6" fill="rgba(3, 6, 16, 0.85)" stroke="#00ff88" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    ISOMETRIC <tspan fill="#00ff88">PRECISION RACER</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#00ff88" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#030610" letter-spacing="1">RACING</text>
</svg>
