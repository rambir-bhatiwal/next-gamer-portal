<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Cyber Drift Tokyo Neo-Alley Game Banner">
  <defs>
    <radialGradient id="cdBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="60%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>
    <filter id="cdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#cdBg)" />
  <!-- Wet Alley Asphalt with Rain Particle Streaks -->
  <line x1="80" y1="20" x2="60" y2="320" stroke="#00f0ff" stroke-width="1" opacity="0.15" />
  <line x1="520" y1="20" x2="540" y2="320" stroke="#ff007f" stroke-width="1" opacity="0.15" />
  <!-- Corner Road Bend -->
  <path d="M 120,340 L 120,180 Q 120,100 220,100 L 500,100" fill="none" stroke="#0e1b38" stroke-width="80" />
  <path d="M 120,340 L 120,180 Q 120,100 220,100 L 500,100" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 16" />
  <!-- Tire Skid Marks -->
  <path d="M 180,310 Q 160,200 280,130" fill="none" stroke="rgba(0, 240, 255, 0.5)" stroke-width="6" />
  <path d="M 210,320 Q 190,210 310,140" fill="none" stroke="rgba(255, 0, 127, 0.5)" stroke-width="6" />
  <!-- Drifting Cyber Car -->
  <g transform="translate(260, 160) rotate(-35)">
    <!-- Smoke particles -->
    <circle cx="-35" cy="-15" r="14" fill="#00f0ff" opacity="0.25" filter="url(#cdGlow)" />
    <circle cx="-35" cy="15" r="14" fill="#ff007f" opacity="0.25" filter="url(#cdGlow)" />
    <rect x="-30" y="-18" width="60" height="36" rx="8" fill="#081022" stroke="#ff007f" stroke-width="2.5" filter="url(#cdGlow)" />
    <!-- Windshield -->
    <rect x="-8" y="-14" width="22" height="28" rx="4" fill="#00f0ff" opacity="0.8" />
    <rect x="26" y="-14" width="5" height="7" rx="2" fill="#ffffff" filter="url(#cdGlow)" />
    <rect x="26" y="7" width="5" height="7" rx="2" fill="#ffffff" filter="url(#cdGlow)" />
  </g>
  <!-- Kanji / Neo Signage -->
  <text x="460" y="240" font-family="'Orbitron', sans-serif" font-size="28" fill="#ff007f" opacity="0.5" font-weight="900">ドリフト</text>
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="240" height="34" rx="6" fill="rgba(4, 9, 20, 0.85)" stroke="#ff007f" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    CYBER <tspan fill="#ff007f">DRIFT</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#ff007f" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">RACING</text>
</svg>
