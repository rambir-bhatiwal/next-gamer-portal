<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Graviton Loop Orbital Roller Game Banner">
  <defs>
    <radialGradient id="glBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140830" />
      <stop offset="60%" stop-color="#080318" />
      <stop offset="100%" stop-color="#02000a" />
    </radialGradient>
    <filter id="glGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#glBg)" />
  <!-- Interior Cylindrical Pipe Grid (360 Loop) -->
  <g transform="translate(300, 170)">
    <!-- Concentric Tunnel Rings into Distance -->
    <ellipse cx="0" cy="0" rx="30" ry="24" fill="#04000d" stroke="#8a2be2" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="70" ry="56" fill="none" stroke="#7000ff" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="130" ry="104" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16 12" filter="url(#glGlow)" />
    <ellipse cx="0" cy="0" rx="210" ry="168" fill="none" stroke="#ff007f" stroke-width="4" filter="url(#glGlow)" />
    <!-- Longitudinal Perspective Lines -->
    <line x1="-210" y1="0" x2="-30" y2="0" stroke="#00f0ff" stroke-width="1" opacity="0.4" />
    <line x1="210" y1="0" x2="30" y2="0" stroke="#00f0ff" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-168" x2="0" y2="-24" stroke="#ff007f" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="168" x2="0" y2="24" stroke="#ff007f" stroke-width="1" opacity="0.4" />
    <!-- Mag-Lev Roller Pod Riding Upper Wall -->
    <g transform="translate(90, -115) rotate(40)">
      <polygon points="0,-12 18,10 -18,10" fill="#0c1834" stroke="#00f0ff" stroke-width="2" filter="url(#glGlow)" />
      <!-- Thruster Plume -->
      <polygon points="-6,10 0,25 6,10" fill="#ff007f" filter="url(#glGlow)" />
    </g>
  </g>
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="260" height="34" rx="6" fill="rgba(6, 1, 18, 0.85)" stroke="#8a2be2" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1">
    GRAVITON <tspan fill="#8a2be2">LOOP</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#8a2be2" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">RACING</text>
</svg>
