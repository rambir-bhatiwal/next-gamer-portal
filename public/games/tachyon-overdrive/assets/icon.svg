<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Tachyon Overdrive Temporal Time-Trial Game Banner">
  <defs>
    <radialGradient id="toBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180424" />
      <stop offset="60%" stop-color="#0a0210" />
      <stop offset="100%" stop-color="#020005" />
    </radialGradient>
    <filter id="toGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#toBg)" />
  <!-- Temporal Clockwork Distortion Portal -->
  <g transform="translate(300, 170)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(255, 0, 127, 0.4)" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#toGlow)" />
    <!-- Clock Ticks on Circumference -->
    <line x1="0" y1="-85" x2="0" y2="-72" stroke="#ffffff" stroke-width="3" />
    <line x1="85" y1="0" x2="72" y2="0" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="85" x2="0" y2="72" stroke="#ffffff" stroke-width="3" />
    <line x1="-85" y1="0" x2="-72" y2="0" stroke="#ffffff" stroke-width="3" />
    <!-- Chrono Rewind Vortex Trails -->
    <path d="M -50,-50 Q 0,-80 50,-50 Q 80,0 50,50 Q 0,80 -50,50" fill="none" stroke="#ff007f" stroke-width="2.5" filter="url(#toGlow)" opacity="0.7" />
    <!-- Racing Craft Emerging from Temporal Rift -->
    <polygon points="0,-40 24,20 0,10 -24,20" fill="#0d041a" stroke="#00f0ff" stroke-width="2.5" filter="url(#toGlow)" />
    <circle cx="0" cy="-5" r="4" fill="#ffffff" />
    <!-- Chrono Rewind Ghost Silhouette (Previous Iteration) -->
    <polygon points="-30,-20 -6,40 -30,30 -54,40" fill="none" stroke="#ff007f" stroke-width="1.8" opacity="0.5" stroke-dasharray="4 4" />
  </g>
  <!-- Rewind Icon Symbol in Top Right -->
  <path d="M 440,40 L 420,50 L 440,60 Z M 420,40 L 400,50 L 420,60 Z" fill="#00f0ff" />
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="280" height="34" rx="6" fill="rgba(6, 1, 14, 0.85)" stroke="#ff007f" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    TACHYON <tspan fill="#ff007f">OVERDRIVE</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#ff007f" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">RACING</text>
</svg>
