<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Plasma Hydrofoil Cyberpunk Waterway Game Banner">
  <defs>
    <linearGradient id="phfBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#021024" />
      <stop offset="50%" stop-color="#041f3d" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>
    <filter id="phfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#phfBg)" />
  <!-- Water Surface Ripple Waves -->
  <path d="M 0,200 Q 150,185 300,200 T 600,200" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" />
  <path d="M 0,240 Q 150,225 300,240 T 600,240" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6" filter="url(#phfGlow)" />
  <path d="M 0,285 Q 150,270 300,285 T 600,285" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" />
  <!-- Canal Neon Wall Boundaries -->
  <polygon points="0,150 140,210 140,340 0,340" fill="#040c1a" stroke="#ff007f" stroke-width="1.5" />
  <polygon points="600,150 460,210 460,340 600,340" fill="#040c1a" stroke="#ff007f" stroke-width="1.5" />
  <!-- Hydrofoil Ski Launching Off Wave -->
  <g transform="translate(300, 210) rotate(-12)">
    <!-- Water Spray Wake Trails -->
    <path d="M -50,15 Q -100,5 -140,30" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7" />
    <path d="M -50,15 Q -90,25 -130,45" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.5" filter="url(#phfGlow)" />
    <!-- Hydrofoil Water Craft -->
    <polygon points="45,-5 20,-15 -45,-10 -50,10 20,8" fill="#0b172a" stroke="#00f0ff" stroke-width="2.5" filter="url(#phfGlow)" />
    <!-- Hydrofoil Twin Fins beneath -->
    <line x1="20" y1="8" x2="30" y2="25" stroke="#ff007f" stroke-width="3" filter="url(#phfGlow)" />
    <line x1="-30" y1="10" x2="-20" y2="25" stroke="#ff007f" stroke-width="3" filter="url(#phfGlow)" />
    <!-- Driver Visor -->
    <circle cx="0" cy="-12" r="5" fill="#ff007f" filter="url(#phfGlow)" />
  </g>
  <!-- Floating Buoy Marker -->
  <circle cx="210" cy="270" r="10" fill="#ffaa00" filter="url(#phfGlow)" />
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="280" height="34" rx="6" fill="rgba(2, 9, 20, 0.85)" stroke="#00f0ff" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    PLASMA <tspan fill="#00f0ff">HYDROFOIL</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#00f0ff" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#020914" letter-spacing="1">RACING</text>
</svg>
