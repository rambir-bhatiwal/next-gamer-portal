<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Hyper Maglev Monorail Blitz Game Banner">
  <defs>
    <linearGradient id="hmgBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05152a" />
      <stop offset="50%" stop-color="#020d1c" />
      <stop offset="100%" stop-color="#01050a" />
    </linearGradient>
    <filter id="hmgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#hmgBg)" />
  <!-- Elevated Multi-Track Skyway Rails -->
  <!-- Track 1 (Left) -->
  <line x1="80" y1="340" x2="240" y2="130" stroke="#00f0ff" stroke-width="4" filter="url(#hmgGlow)" />
  <!-- Track 2 (Center) -->
  <line x1="300" y1="340" x2="300" y2="130" stroke="#00ff88" stroke-width="6" filter="url(#hmgGlow)" />
  <!-- Track 3 (Right) -->
  <line x1="520" y1="340" x2="360" y2="130" stroke="#00f0ff" stroke-width="4" filter="url(#hmgGlow)" />
  <!-- Monorail Support Gantries -->
  <path d="M 40,290 L 560,290" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
  <path d="M 120,220 L 480,220" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
  <!-- Supersonic Maglev Bullet Train on Center Rail -->
  <g transform="translate(300, 240) scale(1.1)">
    <!-- Aerodynamic Train Nose -->
    <polygon points="-24,40 -16,-20 0,-45 16,-20 24,40" fill="#0c1830" stroke="#00ff88" stroke-width="2.5" filter="url(#hmgGlow)" />
    <!-- Cockpit Windshield -->
    <polygon points="-10,-10 0,-30 10,-10 0,-5" fill="#00f0ff" />
    <!-- Magnetic Levitation Glow Underneath -->
    <ellipse cx="0" cy="42" rx="22" ry="5" fill="#00ff88" filter="url(#hmgGlow)" opacity="0.8" />
  </g>
  <!-- Speed Lines -->
  <line x1="280" y1="170" x2="280" y2="140" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="320" y1="180" x2="320" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="260" height="34" rx="6" fill="rgba(2, 9, 20, 0.85)" stroke="#00ff88" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    HYPER <tspan fill="#00ff88">MAGLEV</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#00ff88" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#020914" letter-spacing="1">RACING</text>
</svg>
