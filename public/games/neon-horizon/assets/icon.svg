<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Neon Horizon Game Banner">
  <defs>
    <linearGradient id="nhSky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0a001a" />
      <stop offset="50%" stop-color="#1f0238" />
      <stop offset="100%" stop-color="#4a0055" />
    </linearGradient>
    <linearGradient id="nhSun" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="nhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#nhSky)" />
  <!-- Synthwave Sunset -->
  <circle cx="300" cy="160" r="75" fill="url(#nhSun)" filter="url(#nhGlow)" />
  <g fill="#1f0238">
    <rect x="220" y="155" width="160" height="3" /><rect x="220" y="163" width="160" height="4.5" />
    <rect x="220" y="173" width="160" height="6" /><rect x="220" y="186" width="160" height="9" />
  </g>
  <!-- Road with Dynamic Curve Projection -->
  <path d="M 270,195 Q 300,195 330,195 L 580,340 L 20,340 Z" fill="#090518" stroke="#ff007f" stroke-width="1.5" />
  <!-- Center Dashed Line -->
  <path d="M 300,195 Q 320,260 300,340" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 10" filter="url(#nhGlow)" />
  <!-- Wireframe Palm Trees on Sides -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.75" filter="url(#nhGlow)">
    <path d="M 100,340 Q 120,260 140,210 M 140,210 Q 110,185 80,195 M 140,210 Q 140,175 160,185 M 140,210 Q 180,190 190,215" />
    <path d="M 500,340 Q 480,260 460,210 M 460,210 Q 490,185 520,195 M 460,210 Q 460,175 440,185 M 460,210 Q 420,190 410,215" />
  </g>
  <!-- Sports Coupe Rear Profile -->
  <g transform="translate(300, 275) scale(1.1)">
    <polygon points="-38,20 -28,-5 28,-5 38,20" fill="#0d041a" stroke="#ff007f" stroke-width="2.5" filter="url(#nhGlow)" />
    <!-- Glowing Tail Lights -->
    <rect x="-34" y="2" width="22" height="6" rx="2" fill="#ff007f" filter="url(#nhGlow)" />
    <rect x="12" y="2" width="22" height="6" rx="2" fill="#ff007f" filter="url(#nhGlow)" />
    <!-- Rear License Plate -->
    <rect x="-10" y="8" width="20" height="7" fill="#00f0ff" />
  </g>
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="240" height="34" rx="6" fill="rgba(8, 0, 20, 0.85)" stroke="#ff007f" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    NEON <tspan fill="#ff007f">HORIZON</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#ff007f" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">RACING</text>
</svg>
