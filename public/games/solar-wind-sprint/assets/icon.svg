<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Solar Wind Sprint Asteroid Slalom Game Banner">
  <defs>
    <radialGradient id="swsBg" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#3b1d00" />
      <stop offset="35%" stop-color="#1c0b00" />
      <stop offset="100%" stop-color="#050208" />
    </radialGradient>
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="swsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#swsBg)" />
  <!-- Massive Solar Star on Left Erupting Flares -->
  <circle cx="0" cy="170" r="130" fill="#ff7700" filter="url(#swsGlow)" opacity="0.8" />
  <path d="M 120,130 Q 200,100 240,140 Q 180,180 120,170" fill="none" stroke="#ffaa00" stroke-width="3" opacity="0.6" filter="url(#swsGlow)" />
  <!-- Solar Sail Ship Gliding through Slalom Gates -->
  <g transform="translate(320, 160) rotate(-15)">
    <!-- Shimmering Solar Sail Diamond -->
    <polygon points="0,-45 40,0 0,45 -40,0" fill="url(#sailGrad)" opacity="0.75" filter="url(#swsGlow)" />
    <!-- Ship Capsule Core -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#ffffff" stroke-width="1.5" />
  </g>
  <!-- Slalom Asteroid Hazards -->
  <polygon points="440,90 470,75 490,110 455,125" fill="#140d08" stroke="#ffaa00" stroke-width="2" />
  <polygon points="410,230 450,220 460,260 420,270" fill="#140d08" stroke="#ff7700" stroke-width="2" />
  <!-- Title Badge Overlay -->
  <rect x="25" y="25" width="280" height="34" rx="6" fill="rgba(10, 4, 1, 0.85)" stroke="#ffaa00" stroke-width="1.2" />
  <text x="38" y="48" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    SOLAR WIND <tspan fill="#ffaa00">SPRINT</tspan>
  </text>
  <rect x="490" y="25" width="85" height="26" rx="4" fill="#ffaa00" />
  <text x="508" y="42" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#0c0400" letter-spacing="1">RACING</text>
</svg>
